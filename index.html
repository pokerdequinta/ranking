<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poker de Quinta | Ranking Oficial</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Anton&family=Roboto:wght@300;400;700&display=swap');

        :root {
            --bg-main: #0d1b0d;
            --bg-card: #102810;
            --gold: #d4a121;
            --green-mid: #1a3d1a;
            --green-accent: #2d5016;
            --red-alert: #c72c48;
            --text: #fff;
            --shadow: 0 10px 50px rgba(212, 161, 33, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-main);
            color: var(--text);
            font-family: 'Roboto', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* --- Tipografia --- */
        h1, h2, h3, .anton {
            font-family: 'Anton', sans-serif;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--gold);
            text-shadow: 0 0 20px rgba(212, 161, 33, 0.5);
        }

        /* --- Layout --- */
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        header {
            text-align: center;
            padding: 50px 0;
            background: linear-gradient(135deg, var(--bg-main), var(--green-mid));
            border-bottom: 2px dashed var(--gold);
            margin-bottom: 40px;
        }

        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        /* --- Componentes --- */
        .card {
            background: var(--bg-card);
            border: 2px solid var(--gold);
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--shadow);
            transition: all 0.3s;
        }

        .card:hover { transform: translateY(-5px); box-shadow: 0 15px 60px rgba(212, 161, 33, 0.6); }

        .btn {
            background: var(--gold);
            color: #000;
            padding: 15px 35px;
            border-radius: 10px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-family: 'Anton', sans-serif;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover { transform: translateY(-3px); box-shadow: 0 5px 20px rgba(212, 161, 33, 0.8); }

        /* --- Ranking Table --- */
        .ranking-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 10px;
        }

        .rank-item {
            background: var(--green-mid);
            transition: 0.3s;
        }

        .rank-item.top-10 { background: linear-gradient(135deg, #1a3d1a, #2d5016); border: 1px solid var(--gold); }
        .rank-item.first-place { border: 3px solid var(--gold); background: linear-gradient(135deg, #2d5016, #d4a12133); }

        .rank-item td { padding: 15px; text-align: center; }
        .rank-item td:first-child { border-radius: 15px 0 0 15px; font-size: 1.5rem; }
        .rank-item td:last-child { border-radius: 0 15px 15px 0; }

        .player-img {
            width: 50px; height: 50px;
            border-radius: 50%;
            border: 2px solid var(--gold);
            object-fit: cover;
        }

        .trend-up { color: #00ff00; }
        .trend-down { color: var(--red-alert); }

        /* --- Admin Panel --- */
        .admin-section { display: none; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        input {
            padding: 10px;
            background: #000;
            border: 1px solid var(--gold);
            color: white;
            border-radius: 5px;
        }

        .grid-etapas {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        /* --- Responsividade --- */
        @media (max-width: 768px) {
            .ranking-table thead { display: none; }
            .rank-item { display: flex; flex-direction: column; align-items: center; margin-bottom: 20px; border-radius: 20px !important; }
            .rank-item td { border: none !important; }
        }

        .gap-leader { font-size: 0.8rem; opacity: 0.8; color: var(--gold); }
    </style>
</head>
<body>

<header>
    <h1>♠ Poker de Quinta ♥</h1>
    <p style="opacity: 0.8;">Ranking Oficial - Temporada 2026</p>
</header>

<div class="container">
    <div class="nav-tabs">
        <button class="btn" onclick="showPage('ranking')">🏆 Ranking</button>
        <button class="btn" onclick="showPage('admin')">⚙️ Admin</button>
    </div>

    <section id="ranking-page">
        <div class="card">
            <h2 style="margin-bottom: 20px;">Classificação Geral ♣</h2>
            <table class="ranking-table">
                <thead>
                    <tr style="color: var(--gold)">
                        <th>POS</th>
                        <th>JOGADOR</th>
                        <th>NOME</th>
                        <th>PTS TOTAL</th>
                        <th>DIF. LÍDER</th>
                        <th>TENDÊNCIA</th>
                    </tr>
                </thead>
                <tbody id="ranking-body">
                    </tbody>
            </table>
        </div>
    </section>

    <section id="admin-page" class="admin-section">
        <div class="card">
            <h2>Adicionar/Editar Jogador ♦</h2>
            <form id="player-form" style="margin-top: 20px;">
                <div class="form-group">
                    <label>Nome do Jogador:</label>
                    <input type="text" id="p-name" required>
                </div>
                <div class="form-group">
                    <label>Foto (URL ou Base64):</label>
                    <input type="text" id="p-img" placeholder="Link da imagem">
                    <input type="file" id="p-file" accept="image/*" style="margin-top: 5px;">
                </div>
                
                <p style="margin-top: 20px; color: var(--gold)">Pontos por Etapa (1 a 12):</p>
                <div class="grid-etapas" id="etapas-inputs">
                    </div>
                
                <button type="submit" class="btn" style="margin-top: 20px; width: 100%;">Salvar Jogador</button>
            </form>
        </div>

        <div class="card" style="margin-top: 30px;">
            <h3>Gerenciar Jogadores</h3>
            <div id="admin-list"></div>
        </div>
    </section>
</div>

<script>
    // Inicialização de Dados
    let players = JSON.parse(localStorage.getItem('poker_players')) || [];

    function showPage(page) {
        document.getElementById('ranking-page').style.display = page === 'ranking' ? 'block' : 'none';
        document.getElementById('admin-page').style.display = page === 'admin' ? 'block' : 'none';
        if(page === 'ranking') renderRanking();
        if(page === 'admin') renderAdminList();
    }

    // Gerar inputs das 12 etapas
    const etapasDiv = document.getElementById('etapas-inputs');
    for(let i=1; i<=12; i++) {
        etapasDiv.innerHTML += `
            <div class="form-group">
                <label>E${i}</label>
                <input type="number" class="etapa-val" data-idx="${i-1}" value="0">
            </div>
        `;
    }

    // Converter imagem para Base64 para salvar no localStorage
    let currentImgBase64 = "";
    document.getElementById('p-file').addEventListener('change', function(e) {
        const reader = new FileReader();
        reader.onload = function() { currentImgBase64 = reader.result; };
        reader.readAsDataURL(e.target.files[0]);
    });

    // Salvar Jogador
    document.getElementById('player-form').onsubmit = function(e) {
        e.preventDefault();
        const name = document.getElementById('p-name').value;
        const imgUrl = document.getElementById('p-img').value;
        const scores = Array.from(document.querySelectorAll('.etapa-val')).map(input => parseInt(input.value) || 0);
        
        // Lógica de Tendência (compara soma da etapa atual vs anterior - simplificado)
        // Em um sistema real, você compararia a posição no array ordenado da etapa 11 vs etapa 12
        
        const newPlayer = {
            id: Date.now(),
            name: name,
            img: currentImgBase64 || imgUrl || 'https://via.placeholder.com/50',
            scores: scores,
            total: scores.reduce((a, b) => a + b, 0),
            prevTotal: scores.slice(0, -1).reduce((a, b) => a + b, 0) 
        };

        players.push(newPlayer);
        saveAndRefresh();
        this.reset();
        currentImgBase64 = "";
    };

    function saveAndRefresh() {
        localStorage.setItem('poker_players', JSON.stringify(players));
        renderRanking();
        renderAdminList();
    }

    function renderRanking() {
        const tbody = document.getElementById('ranking-body');
        // Ordenar por total
        players.sort((a, b) => b.total - a.total);
        
        const leaderScore = players.length > 0 ? players[0].total : 0;
        
        tbody.innerHTML = players.map((p, index) => {
            const isTop10 = index < 10;
            const isFirst = index === 0;
            const diff = leaderScore - p.total;
            
            // Lógica de seta: subiu ou desceu (comparação simples de pontuação na última rodada)
            const lastScore = p.scores[p.scores.length - 1];
            const trend = lastScore > 0 ? '<span class="trend-up">▲</span>' : '<span class="trend-down">▼</span>';

            return `
                <tr class="rank-item ${isFirst ? 'first-place' : ''} ${isTop10 ? 'top-10' : ''}">
                    <td class="anton">${index + 1}º</td>
                    <td><img src="${p.img}" class="player-img"></td>
                    <td style="font-weight: bold">${p.name}</td>
                    <td style="color: var(--gold); font-weight: bold">${p.total}</td>
                    <td class="gap-leader">${diff > 0 ? `-${diff} pts` : 'LÍDER'}</td>
                    <td>${trend}</td>
                </tr>
            `;
        }).join('');
    }

    function renderAdminList() {
        const list = document.getElementById('admin-list');
        list.innerHTML = players.map(p => `
            <div style="display:flex; justify-content: space-between; align-items:center; padding: 10px; border-bottom: 1px solid #333">
                <span>${p.name} (${p.total} pts)</span>
                <button onclick="deletePlayer(${p.id})" style="background: var(--red-alert); color: white; border:none; padding: 5px 10px; border-radius: 5px; cursor:pointer">Excluir</button>
            </div>
        `).join('');
    }

    function deletePlayer(id) {
        players = players.filter(p => p.id !== id);
        saveAndRefresh();
    }

    // Iniciar
    renderRanking();
</script>

</body>
</html>
