<!-- VERSÃO CORRIGIDA: ADMIN + FIREBASE + GRÁFICO + MOBILE -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ranking Poker de Quinta 2026</title>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Roboto:wght@300;400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Roboto',sans-serif;background:#0d1b0d;color:#fff}

.container{max-width:1600px;margin:auto;padding:15px}
header{text-align:center;background:#102810;border:2px solid #d4a121;border-radius:15px;padding:25px;margin-bottom:20px}
h1{font-family:'Anton';color:#d4a121;letter-spacing:3px}

.view-toggle{display:flex;gap:10px;justify-content:center;margin-bottom:20px}
.view-btn{padding:10px 20px;border-radius:10px;border:2px solid #d4a121;background:#102810;color:#d4a121;font-weight:bold;cursor:pointer}
.view-btn.active{background:#d4a121;color:#000}

/* ===== TABELA ===== */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:1200px}
th,td{padding:10px;text-align:center;border-bottom:1px solid #2d5016}
th{background:#1a3d1a;color:#d4a121;font-family:'Anton';white-space:nowrap}
tr:hover{background:rgba(212,161,33,.08)}

.player-cell{display:flex;align-items:center;gap:8px;text-align:left}
.player-photo{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid #d4a121}
.player-photo-placeholder{width:36px;height:36px;border-radius:50%;background:#1a3d1a;display:flex;align-items:center;justify-content:center}

.top5{background:linear-gradient(90deg,rgba(255,215,0,.18),transparent)}
.top10{background:linear-gradient(90deg,rgba(255,165,0,.12),transparent)}

.etapa{font-weight:bold;padding:4px 6px;border-radius:5px;background:#1a3d1a}
.etapa.nj{background:#8b0000;opacity:.7}

/* ===== GRAFICO ===== */
.chart-box{background:#102810;border:2px solid #d4a121;border-radius:15px;padding:20px;margin-top:25px}
.chart-box h2{font-family:'Anton';color:#d4a121;text-align:center;margin-bottom:15px}

/* ===== ADMIN ===== */
.admin{background:#1a1a1a;border:2px solid #8b0000;border-radius:15px;padding:20px}
.admin h2{font-family:'Anton';color:#8b0000;margin-bottom:15px}

input,button{padding:10px;border-radius:8px;border:none}
input{background:#102810;color:#fff;border:1px solid #2d5016}
button{cursor:pointer;font-weight:bold}
.btn{background:#d4a121;color:#000}

/* ===== MOBILE ===== */
@media(max-width:768px){
  h1{font-size:1.6em}
  table{font-size:.8em}
  .player-name{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}
</style>
</head>
<body>

<div class="container">
<header>
<h1>🏆 RANKING POKER DE QUINTA 2026</h1>
</header>

<div class="view-toggle">
<button class="view-btn active" id="btnRanking">📊 Ranking</button>
<button class="view-btn" id="btnAdmin">🔐 Admin</button>
</div>

<!-- ===== RANKING ===== -->
<div id="viewRanking">
<div class="table-wrap">
<table>
<thead>
<tr>
<th>Pos</th><th>Jogador</th><th>Total</th><th>Dif. Líder</th><th>Part.</th>
<th>E1</th><th>E2</th><th>E3</th><th>E4</th><th>E5</th><th>E6</th>
<th>E7</th><th>E8</th><th>E9</th><th>E10</th><th>E11</th><th>E12</th>
</tr>
</thead>
<tbody id="rankingBody"></tbody>
</table>
</div>

<div class="chart-box">
<h2>📈 Evolução do Ranking (Top 5)</h2>
<canvas id="grafico"></canvas>
</div>
</div>

<!-- ===== ADMIN ===== -->
<div id="viewAdmin" style="display:none">
<div class="admin">
<h2>Painel Administrativo</h2>
<input id="nomeJogador" placeholder="Nome do jogador">
<input id="fotoJogador" placeholder="URL da foto">
<button class="btn" onclick="adicionarJogador()">Adicionar Jogador</button>
</div>
</div>

</div>

<script>
/* ===== FIREBASE ===== */
const FIREBASE_URL = 'https://poker-de-quinta-default-rtdb.firebaseio.com';
const TOTAL_ETAPAS = 12;
let jogadores = [];
let etapas = {};

async function fbGet(path){ const r = await fetch(`${FIREBASE_URL}/${path}.json`); return r.json(); }
async function fbPost(path,data){ await fetch(`${FIREBASE_URL}/${path}.json`,{method:'POST',body:JSON.stringify(data)}); }

async function carregar(){
 jogadores=[];
 const j = await fbGet('rankingJogadores');
 if(j) Object.keys(j).forEach(id=>jogadores.push({...j[id],id}));
 const e = await fbGet('rankingEtapas');
 etapas = e||{};
 render();
}

function calcularRanking(){
 const dados = jogadores.map(j=>{
   const scores=[]; let part=0;
   for(let i=1;i<=TOTAL_ETAPAS;i++){
     const v = etapas[i]?.[j.id]||0;
     if(v>0){scores.push(v);part++;}
   }
   const total = scores.sort((a,b)=>b-a).slice(0,10).reduce((s,v)=>s+v,0);
   return {...j,total,part};
 });
 dados.sort((a,b)=>b.total-a.total);
 dados.forEach((j,i)=>j.pos=i+1);
 return dados;
}

function render(){
 const ranking = calcularRanking();
 const lider = ranking[0]?.total||0;
 const body = document.getElementById('rankingBody');
 body.innerHTML='';
 ranking.forEach(j=>{
  const tr=document.createElement('tr');
  tr.className=j.pos<=5?'top5':j.pos<=10?'top10':'';
  tr.innerHTML=`
   <td>${j.pos}º</td>
   <td class="player-cell">${j.foto?`<img src="${j.foto}" class="player-photo">`:`<div class="player-photo-placeholder">👤</div>`}<span class="player-name">${j.nome}</span></td>
   <td>${j.total}</td>
   <td>${j.pos===1?'-':lider-j.total}</td>
   <td>${j.part}</td>
   ${Array.from({length:TOTAL_ETAPAS},(_,i)=>{
     const v=etapas[i+1]?.[j.id]||0;
     return `<td><span class="etapa ${v===0?'nj':''}">${v===0?'NJ':v}</span></td>`;
   }).join('')}
  `;
  body.appendChild(tr);
 });
 gerarGrafico(ranking.slice(0,5));
}

let chart;
function gerarGrafico(top){
 const labels = Array.from({length:TOTAL_ETAPAS},(_,i)=>`E${i+1}`);
 const datasets = top.map(j=>({
  label:j.nome,
  data:labels.map((_,i)=>{
    const s=[];
    for(let x=1;x<=i+1;x++){
      const v=etapas[x]?.[j.id]; if(v>0) s.push(v);
    }
    return s.sort((a,b)=>b-a).slice(0,10).reduce((a,b)=>a+b,0);
  }),
  tension:.3
 }));
 if(chart) chart.destroy();
 chart=new Chart(document.getElementById('grafico'),{type:'line',data:{labels,datasets},options:{responsive:true}});
}

function adicionarJogador(){
 const nome = nomeJogador.value.trim();
 if(!nome) return alert('Nome obrigatório');
 fbPost('rankingJogadores',{nome,foto:fotoJogador.value||''});
 nomeJogador.value=''; fotoJogador.value='';
}

btnRanking.onclick=()=>{viewRanking.style.display='block';viewAdmin.style.display='none';btnRanking.classList.add('active');btnAdmin.classList.remove('active')};
btnAdmin.onclick=()=>{viewRanking.style.display='none';viewAdmin.style.display='block';btnAdmin.classList.add('active');btnRanking.classList.remove('active')};

carregar();
setInterval(carregar,4000);
</script>
</body>
</html>
