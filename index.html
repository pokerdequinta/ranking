<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking - Poker de Quinta</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Anton&family=Roboto:wght@300;400;700&display=swap');
        
        :root {
            --bg-main: #0d1b0d;
            --bg-card: #102810;
            --gold: #d4a121;
            --green-mid: #1a3d1a;
            --green-accent: #2d5016;
            --red-alert: #c72c48;
            --text: #fff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Roboto', sans-serif; background: var(--bg-main); color: var(--text); min-height: 100vh; }
        
        .container { max-width: 1600px; margin: auto; padding: 20px; }
        
        header { 
            text-align: center; 
            background: var(--bg-card); 
            border: 2px solid var(--gold); 
            border-radius: 15px; 
            padding: 30px; 
            margin-bottom: 30px;
            box-shadow: 0 10px 50px rgba(212, 161, 33, 0.2);
        }

        h1 { font-family: 'Anton'; color: var(--gold); letter-spacing: 3px; font-size: 2.5em; text-shadow: 0 0 20px rgba(212, 161, 33, 0.4); }

        /* Botões de Navegação */
        .view-toggle { display: flex; gap: 10px; justify-content: center; margin-bottom: 25px; }
        .view-btn { padding: 12px 30px; background: var(--bg-card); border: 2px solid var(--gold); border-radius: 10px; color: var(--gold); font-weight: bold; cursor: pointer; transition: 0.3s; font-family: 'Anton'; letter-spacing: 1px; }
        .view-btn.active { background: var(--gold); color: #000; }

        /* Tabela de Ranking */
        .section { background: var(--bg-card); border: 2px solid var(--gold); border-radius: 12px; padding: 20px; overflow: hidden; }
        .ranking-table-container { overflow-x: auto; }
        .ranking-table { width: 100%; border-collapse: collapse; min-width: 1300px; }
        
        .ranking-table th { background: var(--green-mid); color: var(--gold); font-family: 'Anton'; padding: 15px 5px; border-bottom: 2px solid var(--gold); font-size: 0.85em; }
        .ranking-table td { padding: 12px 5px; border-bottom: 1px solid var(--green-accent); text-align: center; font-size: 0.9em; }

        /* Cores Diferenciadas */
        .row-top10 { background: rgba(212, 161, 33, 0.08); }
        .row-leader { background: linear-gradient(90deg, rgba(212, 161, 33, 0.2), transparent); border-left: 4px solid var(--gold); }

        .player-info { display: flex; align-items: center; gap: 10px; text-align: left; padding-left: 10px; }
        .player-photo { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--gold); object-fit: cover; background: #000; }
        
        .score-total { font-family: 'Anton'; color: var(--gold); font-size: 1.4em; }
        .diff-val { font-size: 0.75em; color: var(--red-alert); font-weight: bold; }
        
        .etapa-box { background: var(--green-mid); padding: 4px 6px; border-radius: 4px; min-width: 30px; display: inline-block; font-weight: bold; }
        .etapa-box.nj { background: #333; color: #666; font-size: 0.7em; }
        
        .trend-up { color: #00ff00; font-size: 0.8em; }
        .trend-down { color: var(--red-alert); font-size: 0.8em; }

        /* Admin Styles */
        .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; color: var(--gold); margin-bottom: 5px; font-weight: bold; }
        .form-group input { width: 100%; padding: 10px; background: #000; border: 1px solid var(--gold); color: #fff; border-radius: 8px; }
        
        .player-admin-card { background: var(--green-mid); padding: 15px; border-radius: 10px; margin-bottom: 10px; border: 1px solid var(--green-accent); }
        
        @media (max-width: 768px) {
            .admin-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>♠ POKER DE QUINTA 2026 ♥</h1>
        <p>Ranking Profissional de Etapas</p>
    </header>

    <div class="view-toggle">
        <button class="view-btn active" onclick="switchView('ranking')">🏆 RANKING GERAL</button>
        <button class="view-btn" onclick="switchView('admin')">⚙️ ADMINISTRATIVO</button>
    </div>

    <div id="viewRanking" class="section">
        <div class="ranking-table-container">
            <table class="ranking-table">
                <thead>
                    <tr>
                        <th>POS</th>
                        <th style="text-align:left">JOGADOR</th>
                        <th>TOTAL</th>
                        <th>DIF. LÍDER</th>
                        <th>PART.</th>
                        <th>E1</th><th>E2</th><th>E3</th><th>E4</th><th>E5</th><th>E6</th>
                        <th>E7</th><th>E8</th><th>E9</th><th>E10</th><th>E11</th><th>E12</th>
                    </tr>
                </thead>
                <tbody id="rankingBody">
                    </tbody>
            </table>
        </div>
    </div>

    <div id="viewAdmin" class="section" style="display:none">
        <div class="admin-grid">
            <div class="card-admin">
                <h3 style="color:var(--gold); font-family:'Anton'; margin-bottom:15px;">NOVO JOGADOR</h3>
                <div class="form-group">
                    <label>Nome do Jogador</label>
                    <input type="text" id="admNome" placeholder="Ex: João Silva">
                </div>
                <div class="form-group">
                    <label>URL da Foto</label>
                    <input type="text" id="admFoto" placeholder="https://linkdafoto.com/img.jpg">
                </div>
                <button class="view-btn active" style="width:100%" onclick="addJogador()">ADICIONAR JOGADOR</button>
            </div>
            
            <div id="listaAdminJogadores">
                <h3 style="color:var(--gold); font-family:'Anton'; margin-bottom:15px;">PONTUAÇÃO POR ETAPA</h3>
                </div>
        </div>
    </div>
</div>

<script>
    // Banco de dados simulado (localStorage)
    let db = JSON.parse(localStorage.getItem('pokerDB')) || {
        jogadores: []
    };

    function switchView(view) {
        document.getElementById('viewRanking').style.display = view === 'ranking' ? 'block' : 'none';
        document.getElementById('viewAdmin').style.display = view === 'admin' ? 'block' : 'none';
        
        document.querySelectorAll('.view-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        
        if(view === 'ranking') renderRanking();
        if(view === 'admin') renderAdmin();
    }

    function addJogador() {
        const nome = document.getElementById('admNome').value;
        const foto = document.getElementById('admFoto').value || 'https://cdn-icons-png.flaticon.com/512/149/149071.png';
        
        if(!nome) return alert("Digite o nome!");
        
        db.jogadores.push({
            id: Date.now(),
            nome: nome,
            foto: foto,
            etapas: Array(12).fill(0)
        });
        
        save();
        document.getElementById('admNome').value = '';
        document.getElementById('admFoto').value = '';
        renderAdmin();
    }

    function save() {
        localStorage.setItem('pokerDB', JSON.stringify(db));
    }

    function updateScore(jogadorId, etapaIdx, valor) {
        const jogador = db.jogadores.find(j => j.id === jogadorId);
        jogador.etapas[etapaIdx] = parseInt(valor) || 0;
        save();
    }

    // Calcula a posição de cada jogador em uma etapa específica (acumulado)
    function getRankAtEtapa(etapaAte) {
        let temp = db.jogadores.map(j => {
            let soma = 0;
            for(let i=0; i <= etapaAte; i++) soma += j.etapas[i];
            return { id: j.id, total: soma };
        });
        temp.sort((a, b) => b.total - a.total);
        return temp.map(t => t.id);
    }

    function renderRanking() {
        const tbody = document.getElementById('rankingBody');
        tbody.innerHTML = '';

        // Processar dados e ordenar
        let rankingData = db.jogadores.map(j => {
            const total = j.etapas.reduce((a, b) => a + b, 0);
            const participacoes = j.etapas.filter(pts => pts > 0).length;
            return { ...j, total, participacoes };
        });

        rankingData.sort((a, b) => b.total - a.total);

        const leaderScore = rankingData.length > 0 ? rankingData[0].total : 0;

        // Rankings históricos para setas (compara atual com etapa anterior que teve pontos)
        const currentRanks = getRankAtEtapa(11); // Posição após E12
        const prevRanks = getRankAtEtapa(10);    // Posição após E11

        rankingData.forEach((j, index) => {
            const pos = index + 1;
            const diff = pos === 1 ? "-" : `-${leaderScore - j.total}`;
            const rowClass = pos === 1 ? 'row-leader' : (pos <= 10 ? 'row-top10' : '');
            
            // Lógica da Seta
            const currentPos = currentRanks.indexOf(j.id);
            const prevPos = prevRanks.indexOf(j.id);
            let seta = "";
            if(prevPos !== -1) {
                if(currentPos < prevPos) seta = '<span class="trend-up">▲</span>';
                else if(currentPos > prevPos) seta = '<span class="trend-down">▼</span>';
            }

            let htmlEtapas = "";
            j.etapas.forEach(pts => {
                htmlEtapas += `<td><span class="etapa-box ${pts === 0 ? 'nj' : ''}">${pts === 0 ? 'NJ' : pts}</span></td>`;
            });

            tbody.innerHTML += `
                <tr class="${rowClass}">
                    <td class="anton" style="color:var(--gold)">${pos}º ${seta}</td>
                    <td>
                        <div class="player-info">
                            <img src="${j.foto}" class="player-photo">
                            <span class="player-name">${j.nome}</span>
                        </div>
                    </td>
                    <td class="score-total">${j.total}</td>
                    <td class="diff-val">${diff}</td>
                    <td style="font-weight:bold">${j.participacoes}</td>
                    ${htmlEtapas}
                </tr>
            `;
        });
    }

    function renderAdmin() {
        const container = document.getElementById('listaAdminJogadores');
        container.innerHTML = '<h3 style="color:var(--gold); font-family:\'Anton\'; margin-bottom:15px;">PONTUAÇÃO POR ETAPA</h3>';
        
        db.jogadores.forEach(j => {
            let inputs = "";
            j.etapas.forEach((pts, idx) => {
                inputs += `
                    <div style="display:inline-block; margin: 2px;">
                        <small style="display:block; font-size:10px">E${idx+1}</small>
                        <input type="number" value="${pts}" style="width:45px; padding:3px; background:#000; border:1px solid #444; color:white;" 
                        onchange="updateScore(${j.id}, ${idx}, this.value)">
                    </div>
                `;
            });

            container.innerHTML += `
                <div class="player-admin-card">
                    <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px">
                        <img src="${j.foto}" class="player-photo" style="width:30px; height:30px">
                        <strong style="color:var(--gold)">${j.nome}</strong>
                        <button onclick="removerJogador(${j.id})" style="background:none; border:none; color:var(--red-alert); cursor:pointer; font-size:12px">[Excluir]</button>
                    </div>
                    ${inputs}
                </div>
            `;
        });
    }

    function removerJogador(id) {
        if(confirm("Deseja excluir este jogador?")) {
            db.jogadores = db.jogadores.filter(j => j.id !== id);
            save();
            renderAdmin();
        }
    }

    // Inicialização
    renderRanking();
</script>

</body>
</html>
