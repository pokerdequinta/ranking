<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ranking Poker de Quinta 2026</title>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Roboto:wght@300;400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Roboto',sans-serif;background:#0d1b0d;color:#fff}

.container{max-width:1600px;margin:auto;padding:15px}
header{text-align:center;background:#102810;border:2px solid #d4a121;border-radius:15px;padding:25px;margin-bottom:20px}
h1{font-family:'Anton';color:#d4a121;letter-spacing:3px}

/* ===== TABELA ===== */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:1100px}
th,td{padding:10px;text-align:center;border-bottom:1px solid #2d5016}
th{background:#1a3d1a;color:#d4a121;font-family:'Anton';white-space:nowrap}
tr:hover{background:rgba(212,161,33,.08)}

.player-cell{display:flex;align-items:center;gap:8px;text-align:left}
.player-photo{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid #d4a121}
.player-photo-placeholder{width:36px;height:36px;border-radius:50%;background:#1a3d1a;display:flex;align-items:center;justify-content:center}

.top5{background:linear-gradient(90deg,rgba(255,215,0,.18),transparent)}
.top10{background:linear-gradient(90deg,rgba(255,165,0,.12),transparent)}

.etapa{font-weight:bold;padding:4px 6px;border-radius:5px;background:#1a3d1a}
.etapa.nj{background:#8b0000;opacity:.7}

.up{color:#4CAF50;font-size:.75em}
.down{color:#c72c48;font-size:.75em}

/* ===== GRAFICO ===== */
.chart-box{background:#102810;border:2px solid #d4a121;border-radius:15px;padding:20px;margin-top:25px}
.chart-box h2{font-family:'Anton';color:#d4a121;text-align:center;margin-bottom:15px}

/* ===== MOBILE ===== */
@media(max-width:768px){
  h1{font-size:1.6em}
  table{font-size:.8em}
  .player-name{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}
</style>
</head>
<body>

<div class="container">
<header>
<h1>🏆 RANKING POKER DE QUINTA 2026</h1>
</header>

<div class="table-wrap">
<table id="ranking">
<thead>
<tr>
<th>Pos</th>
<th>Jogador</th>
<th>Total</th>
<th>Dif. Líder</th>
<th>Part.</th>
<th>E1</th><th>E2</th><th>E3</th><th>E4</th><th>E5</th><th>E6</th>
<th>E7</th><th>E8</th><th>E9</th><th>E10</th><th>E11</th><th>E12</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

<div class="chart-box">
<h2>📈 Evolução do Top 5</h2>
<canvas id="grafico"></canvas>
</div>
</div>

<script>
const TOTAL_ETAPAS = 12;

/* ===== MOCK (usa Firebase depois) ===== */
const jogadores = [
 {id:1,nome:'João',foto:'',scores:[120,90,110,80,100,0,95,85,110,0,0,0]},
 {id:2,nome:'Carlos',foto:'',scores:[100,80,95,90,0,85,70,100,90,110,0,0]},
 {id:3,nome:'Ana',foto:'',scores:[90,110,100,95,85,90,0,80,0,0,0,0]},
 {id:4,nome:'Pedro',foto:'',scores:[70,85,90,95,100,110,105,90,80,0,0,0]},
 {id:5,nome:'Lucas',foto:'',scores:[60,70,80,85,90,95,100,105,110,115,0,0]}
];

function calcularRanking(){
 const dados = jogadores.map(j=>{
   const validos = j.scores.filter(v=>v>0).sort((a,b)=>b-a).slice(0,10);
   return {
     ...j,
     total: validos.reduce((s,v)=>s+v,0),
     part: j.scores.filter(v=>v>0).length
   }
 });
 dados.sort((a,b)=>b.total-a.total);
 dados.forEach((j,i)=>j.pos=i+1);
 return dados;
}

const ranking = calcularRanking();
const liderPts = ranking[0].total;
const tbody = document.querySelector('#ranking tbody');

tbody.innerHTML='';
ranking.forEach(j=>{
 const tr = document.createElement('tr');
 tr.className = j.pos<=5?'top5':j.pos<=10?'top10':'';
 tr.innerHTML = `
 <td>${j.pos}º</td>
 <td class="player-cell">
   ${j.foto?`<img src="${j.foto}" class="player-photo">`:`<div class="player-photo-placeholder">👤</div>`}
   <span class="player-name">${j.nome}</span>
 </td>
 <td>${j.total}</td>
 <td>${j.pos===1?'-':liderPts-j.total}</td>
 <td>${j.part}</td>
 ${j.scores.map(s=>`<td><span class="etapa ${s===0?'nj':''}">${s===0?'NJ':s}</span></td>`).join('')}
 `;
 tbody.appendChild(tr);
});

/* ===== GRAFICO ===== */
const labels = Array.from({length:TOTAL_ETAPAS},(_,i)=>`E${i+1}`);
const datasets = ranking.slice(0,5).map(j=>({
 label:j.nome,
 data:j.scores.map((v,i)=>{
   const parcial = j.scores.slice(0,i+1).filter(x=>x>0).sort((a,b)=>b-a).slice(0,10);
   return parcial.reduce((s,x)=>s+x,0);
 }),
 tension:.3
}));

new Chart(document.getElementById('grafico'),{
 type:'line',
 data:{labels,datasets},
 options:{responsive:true,plugins:{legend:{labels:{color:'#fff'}}},scales:{x:{ticks:{color:'#fff'}},y:{ticks:{color:'#fff'}}}}
});
</script>
</body>
</html>
